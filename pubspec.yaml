name: halaqati
description: "Quran-school (madrassa quraania) teacher app for managing a halaqa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.0
  pdf: ^3.11.0
  printing: ^5.13.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  iconsax: ^0.0.8
  shimmer: ^3.0.0
  animations: ^2.2.0
  supabase_flutter: ^2.18.0
  connectivity_plus: ^7.3.2
  # Already in the tree via supabase_flutter; declared because app_exception
  # catches ClientException to recognise a transport failure.
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - surah_aya.json
    - assets/icons/pico.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/pic2.png"
  min_sdk_android: 21
  remove_alpha_ios: true